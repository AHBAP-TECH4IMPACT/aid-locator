<!-- map.component.html -->
<section class="map-section">
  <div class="map-container">

    <google-map
      [center]="center"
      [zoom]="zoom"
      [options]="mapOptions"
      width="100%"
      height="100%">
      

      @for( marker of markers; track marker.id) {
      <map-marker
        [position]="marker.position"
        [title]="marker.title"
        [options]="marker.options"
        (mapClick)="openInfoWindow(markerElem, marker.listing)"
        #markerElem="mapMarker">
      </map-marker>

      }

      <map-info-window>
        @if( selectedListing ) {
            <div class="info-window">
            <h3>{{ selectedListing.name }}</h3>
            <p class="address">📍 {{ selectedListing.address }}</p>
            
            <div class="popup-services">
            @for (service of getServicesList(selectedListing.servicesOffered); track service.label) {
                <span class="service-badge">
                {{ service.icon }} {{ service.label }}
                </span>
            }
            </div>
            
            <span class="status-badge">Open</span>
            </div>
        }
      </map-info-window>
    </google-map>
  </div>
</section>
